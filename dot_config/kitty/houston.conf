# vim:ft=kitty

## name:     Houston
## author:   Haoxuan Zeng
## upstream: https://github.com/withastro/houston-vscode
## blurb:    Cool blues, minty greens, and soft purples — Astro's Houston theme for Kitty
##
## Colors from themes/houston.json terminal.ansi* entries.
## Cursor is white (matching VSCode Houston editor cursor).

# ── Basic colors ──────────────────────────────────────────────────────────────
foreground              #cccccc
background              #17191e
selection_foreground    none
selection_background    #2c3e5c

# ── Cursor — white, matching VSCode screenshot ────────────────────────────────
cursor                  #ffffff
cursor_text_color       #17191e

# ── URL ───────────────────────────────────────────────────────────────────────
url_color               #54b9ff

# ── Window borders ────────────────────────────────────────────────────────────
active_border_color     #4bf3c8
inactive_border_color   #545864
bell_border_color       #ffd493

# ── OS Window titlebar ────────────────────────────────────────────────────────
wayland_titlebar_color  background
macos_titlebar_color    background

# ── Tab bar ───────────────────────────────────────────────────────────────────
active_tab_foreground   #17191e
active_tab_background   #4bf3c8
inactive_tab_foreground #858b98
inactive_tab_background #23262d
tab_bar_background      #17191e

# ── Marks ─────────────────────────────────────────────────────────────────────
mark1_foreground #17191e
mark1_background #4bf3c8
mark2_foreground #17191e
mark2_background #cc75f4
mark3_foreground #17191e
mark3_background #54b9ff

# ── The 16 terminal colors ────────────────────────────────────────────────────
# terminal.ansi* from houston.json

# black
color0  #17191e
color8  #545864

# red
color1  #dc3657
color9  #f4587e

# green
color2  #23d18b
color10 #4bf3c8

# yellow
color3  #ffc368
color11 #ffd493

# blue
color4  #2b7eca
color12 #54b9ff

# magenta / purple
color5  #ad5dca
color13 #cc75f4

# cyan / teal
color6  #24c0cf
color14 #00daef

# white
color7  #eef0f9
color15 #fafafa

# ── Opaque window (overrides kitty.conf background_opacity) ───────────────────
# Transparency lets the desktop bleed through and makes the editor look blue-tinted.
background_opacity 0.95
